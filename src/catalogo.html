<head>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F338;</text></svg>" />

  <meta property="og:title" content="Ami Florería | Arreglos Exclusivos en Hermosillo">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            body: ['Inter', 'sans-serif'],
          },
          colors: {
            primary:       '#E05B7F',
            'primary-dk':  '#C04868',
            'primary-soft':'#FAE8EF',
            'rose-bg':     '#FDF0F4',
            'cream-bg':    '#FAF5F0',
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    /* ── Skeleton loader ── */
    .skeleton {
      background: linear-gradient(90deg, #f5f5f5 25%, #ebebeb 50%, #f5f5f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Modal transition ── */
    #product-modal { transition: opacity 0.2s ease; }

    /* ── Modal image container ── */
    .modal-img-wrap {
      height: 18rem;
      background: var(--bg-rose, #FDF0F4);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Swipe hint ── */
    .swipe-hint {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      color: #BBBBBB;
      letter-spacing: 0.05em;
      text-align: center;
      margin-top: 0.75rem;
    }

    /* ── line-clamp polyfill ── */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

      <a href="index.html" class="flex items-center">
        <img src="assets/logo.png" alt="AMI Florería" class="h-10 w-auto object-contain" />
      </a>

        <span class="text-2xl leading-none">&#x1F338;</span>
        <span class="font-display text-2xl font-medium tracking-wide text-primary">AMI</span>
        <span class="font-body text-xs font-light tracking-[0.2em] uppercase text-[#1A1A1A] opacity-60">Florería</span>
      </a>-->

      <!-- Actions -->
      <div class="flex items-center gap-3">
        <a href="index.html"
           class="hidden md:inline-flex items-center gap-1 font-body text-sm text-[#777777] hover:text-primary transition-colors duration-200">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
          </svg>
          Inicio

  <!-- ======================================================
       MAIN
  ====================================================== -->
  <main class="pt-28 pb-24 px-6">
    <div class="max-w-7xl mx-auto">

      <!-- Page header -->
      <div class="mb-16 text-center">
        <span class="font-body text-xs uppercase tracking-[0.25em] text-primary mb-3 block">AMI Florería — Hermosillo</span>
        <h1 class="font-display text-5xl sm:text-6xl lg:text-7xl font-normal text-[#1A1A1A] leading-tight mb-5">
          Nuestro<br /><em class="text-primary italic">Catálogo</em>
        </h1>
        <p class="font-body text-sm text-[#777777] max-w-sm mx-auto leading-relaxed">
          * El color de las flores y papel puede variar según disponibilidad o gusto.
        </p>
      </div>

      <!-- Category filter — rendered by JS -->
      <div class="mb-12">
        <p class="font-body text-xs uppercase tracking-[0.25em] text-[#AAAAAA] mb-4 text-center">Filtrar por categoría</p>
        <div id="category-filter" class="flex flex-wrap justify-center gap-2">
          <!-- skeleton chips while loading -->
          <div class="skeleton h-9 rounded-full w-16"></div>
          <div class="skeleton h-9 rounded-full w-32"></div>
          <div class="skeleton h-9 rounded-full w-24"></div>
          <div class="skeleton h-9 rounded-full w-20"></div>
          <div class="skeleton h-9 rounded-full w-24"></div>
          <div class="skeleton h-9 rounded-full w-20"></div>
          <div class="skeleton h-9 rounded-full w-24"></div>
        </div>
      </div>

      <!-- Catalog root — rendered by JS -->
      <div id="catalog-root"></div>

    </div>
  </main>

  <!-- ======================================================
       PRODUCT MODAL / LIGHTBOX
  ====================================================== -->
  <div id="product-modal"
       class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4"
       role="dialog" aria-modal="true" aria-label="Detalle del producto">

    <!-- Backdrop -->
    <div id="modal-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

    <!-- Card -->
    <div id="modal-card"
         class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden select-none"
         style="max-height: 90vh; overflow-y: auto;">

      <!-- Close -->
      <button id="modal-close" aria-label="Cerrar"
              class="absolute top-3 right-3 z-20 w-9 h-9 flex items-center justify-center
                     rounded-full bg-white/90 backdrop-blur shadow text-[#1A1A1A]
                     hover:bg-[#EDEDED] transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <!-- Prev arrow -->
      <button id="modal-prev" aria-label="Producto anterior"
              class="absolute left-3 top-[9rem] z-20 w-10 h-10 flex items-center justify-center
                     rounded-full bg-white/90 backdrop-blur shadow-md text-[#1A1A1A]
                     hover:bg-white transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>

      <!-- Next arrow -->
      <button id="modal-next" aria-label="Siguiente producto"
              class="absolute right-3 top-[9rem] z-20 w-10 h-10 flex items-center justify-center
                     rounded-full bg-white/90 backdrop-blur shadow-md text-[#1A1A1A]
                     hover:bg-white transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </button>

      <!-- Image -->
      <div class="modal-img-wrap relative">
        <img id="modal-img" src="" alt=""/>
        <!-- Counter badge -->
        <span id="modal-counter"
              class="absolute bottom-3 right-4 font-body text-xs text-white
                     bg-black/40 rounded-full px-3 py-1 backdrop-blur-sm">
        </span>
      </div>

      <!-- Info -->
      <div class="p-6">
        <span id="modal-cat"
              class="font-body text-[10px] uppercase tracking-[0.25em] text-primary mb-1 block">
        </span>
        <h2 id="modal-name"
            class="font-display text-2xl font-medium mb-2 capitalize leading-snug">
        </h2>
        <p id="modal-desc"
           class="font-body text-sm text-[#777777] leading-relaxed mb-5">
        </p>
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <span id="modal-price"
                class="font-display text-3xl font-normal text-primary">
          </span>
          <a id="modal-wa" href="#" target="_blank" rel="noopener noreferrer"
             class="inline-flex items-center gap-2
                    bg-[#C04868] hover:bg-[#9E3460] text-white
                    font-body font-medium text-sm px-5 py-3 rounded-full
                    shadow-lg shadow-primary/35 -translate-y-0.5
                    transition-all duration-200
                    hover:-translate-y-1 hover:shadow-xl hover:shadow-primary/50">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="currentColor">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>

            Pedir este
